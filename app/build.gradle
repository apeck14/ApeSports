plugins { id 'com.android.application' }
def updateKeystore = System.getenv('APESPORTS_KEYSTORE')
android {
    // Keep the original Android identity for installed-app and saved-feed compatibility.
    namespace 'tv.gridiron.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'tv.gridiron.app'; minSdk 23; targetSdk 35; versionCode 9; versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    if (updateKeystore) {
        signingConfigs {
            release {
                storeFile file(updateKeystore)
                storePassword System.getenv('APESPORTS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('APESPORTS_KEY_ALIAS')
                keyPassword System.getenv('APESPORTS_KEY_PASSWORD')
            }
        }
        buildTypes.release.signingConfig = signingConfigs.release
    }
}
dependencies {
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

tasks.register('prepareUpdate') {
    dependsOn 'assembleRelease'
    doLast {
        if (!updateKeystore) throw new GradleException('Set APESPORTS_KEYSTORE and its signing credentials before preparing an update.')
        def apk = file('build/outputs/apk/release/app-release.apk')
        def destination = file('build/outputs/update')
        destination.mkdirs()
        copy { from apk; into destination; rename { 'ApeSports.apk' } }
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(apk.bytes).encodeHex().toString()
        def version = android.defaultConfig.versionName
        def manifest = [versionCode: android.defaultConfig.versionCode, versionName: version,
            apkUrl: "https://github.com/apeck14/ApeSports/releases/download/v${version}/ApeSports.apk",
            sha256: hash, bytes: apk.length()]
        new File(destination, 'update.json').setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)), 'UTF-8')
    }
}
